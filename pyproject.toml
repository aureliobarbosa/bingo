[project]
name = "bingo"
version = "1.0"
description = "Gerador web de cartelas de bingo para impressão"
authors = [{ name = "Marco Aurélio Alves Barbosa" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.32",
    "reportlab>=4.2",
    "pillow>=12.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pypdf>=6.18.1",
    "httpx2>=2.13.1",
    "ruff>=0.16.6",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

# Ponto de entrada para o `fastapi run`, que é como o FastAPI Cloud sobe o
# serviço. Sem isto o CLI procura `main.py`/`app.py`/`api.py` na raiz e não acha
# nada, porque o app vive em `src/bingo/api.py`.
[tool.fastapi]
entrypoint = "bingo.api:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

# Regras mínimas: erros de sintaxe e de fluxo (E, F), imports ordenados (I).
# O objetivo é pegar o que quebra, não impor estilo além do que o `ruff format`
# já resolve sozinho.
[tool.ruff.lint]
select = ["E", "F", "I"]
