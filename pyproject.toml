[project]
name = "bingo"
version = "0.1.0"
description = "Gerador web de cartelas de bingo para impressão"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "reportlab>=4.2",
    "pillow>=11",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pypdf>=5.1",
    "httpx2>=2.12.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
